<div class="anab" role="region" aria-label="announcement" data-dismissible="{{settings.dismissible}}" data-key="{{settings.message}}" style="--anab-bg: {{settings.background}}; --anab-fg: {{settings.color}}">
  <p class="anab-text">{{settings.message}} <a class="anab-link" href="{{settings.linkUrl}}">{{settings.linkText}} →</a></p>
  <button type="button" class="anab-close" aria-label="ปิด / Close">×</button>
</div>
