<div class="pt" style="--pt-accent: {{props.color}}">
  <span class="pt-badge">{{props.badge}}</span>
  <h3 class="pt-name">{{props.plan}}</h3>
  <p class="pt-price"><strong>{{props.price}}</strong><span>{{props.period}}</span></p>
  <p class="pt-features">{{props.features}}</p>
  <a class="pt-btn" href="{{props.buttonUrl}}">{{props.buttonText}}</a>
</div>
