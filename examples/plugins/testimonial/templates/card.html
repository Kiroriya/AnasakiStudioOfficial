<figure class="tm">
  <div class="tm-stars" data-stars="{{props.stars}}" aria-label="{{props.stars}}/5"><span>★★★★★</span></div>
  <blockquote class="tm-quote">“{{props.quote}}”</blockquote>
  <figcaption class="tm-who">
    <img class="tm-avatar" src="{{props.avatar}}" alt="{{props.name}}" loading="lazy">
    <span class="tm-meta"><strong class="tm-name">{{props.name}}</strong><span class="tm-role">{{props.role}}</span></span>
  </figcaption>
</figure>
