<div class="cd" data-countdown="{{props.target}}" data-done="{{props.doneText}}" style="--cd-accent: {{props.color}}">
  <p class="cd-title">{{props.title}}</p>
  <div class="cd-grid">
    <div class="cd-cell"><b data-cd="days">--</b><span>วัน · days</span></div>
    <div class="cd-cell"><b data-cd="hours">--</b><span>ชั่วโมง · hrs</span></div>
    <div class="cd-cell"><b data-cd="minutes">--</b><span>นาที · min</span></div>
    <div class="cd-cell"><b data-cd="seconds">--</b><span>วินาที · sec</span></div>
  </div>
  <p class="cd-done" hidden></p>
</div>
