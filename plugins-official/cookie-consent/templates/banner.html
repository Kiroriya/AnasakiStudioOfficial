<style>#anasaki-cc[hidden]{display:none!important}</style>
<div id="anasaki-cc" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden data-pos="{{settings.position}}" data-bg="{{settings.background}}" data-fg="{{settings.textColor}}" data-btn="{{settings.buttonColor}}" data-btn-fg="{{settings.buttonTextColor}}" style="position:fixed;left:16px;right:16px;bottom:16px;z-index:2147483000;max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font:14px/1.5 'Inter','Noto Sans Thai',system-ui,sans-serif;background:#111827;color:#f9fafb"><p style="margin:0;flex:1 1 320px">{{settings.message}} <a data-cc-policy href="{{settings.policyUrl}}" style="color:inherit;text-decoration:underline">{{settings.policyText}}</a></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-consent="declined" style="border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor">{{settings.declineText}}</button><button type="button" data-consent="accepted" style="border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;background:#4f46e5;color:#fff">{{settings.acceptText}}</button></div></div>
<script>(function(){var k='anasaki_consent',el=document.getElementById('anasaki-cc');if(!el)return;
var d=el.dataset,s=el.style,acc=el.querySelector('[data-consent=accepted]'),dec=el.querySelector('[data-consent=declined]'),pol=el.querySelector('[data-cc-policy]');
if(d.pos==='top'){s.bottom='auto';s.top='16px'}if(d.bg)s.background=d.bg;if(d.fg)s.color=d.fg;
if(acc){if(d.btn)acc.style.background=d.btn;if(d.btnFg)acc.style.color=d.btnFg}
if(dec&&!dec.textContent.trim())dec.remove();if(pol&&!pol.getAttribute('href'))pol.remove();
var c=null;try{c=localStorage.getItem(k)}catch(e){}
window.anasakiConsent=c;if(!c)el.hidden=false;
el.addEventListener('click',function(ev){var v=ev.target&&ev.target.getAttribute&&ev.target.getAttribute('data-consent');if(!v)return;
try{localStorage.setItem(k,v);localStorage.setItem(k+'_at',new Date().toISOString())}catch(e){}
window.anasakiConsent=v;el.hidden=true;try{document.dispatchEvent(new CustomEvent('anasaki:consent',{detail:v}))}catch(e){}})})();</script>
